name: Clase-Clima CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. PRUEBAS DEL BACKEND
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.3"
        cache: 'pip'

    - name: Instalar dependencias del Backend
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        # Dependencias de testing y hallazgo de QA (bcrypt 4.0.1)
        pip install pytest==9.1.1 httpx==0.28.1 bcrypt==4.0.1

    - name: Ejecutar pruebas automatizadas (pytest)
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      run: |
        cd backend
        pytest tests/ -v

  # 2. PRUEBAS Y BUILD DEL FRONTEND
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Instalar dependencias del Frontend
      run: |
        cd frontend
        npm ci

    - name: Ejecutar pruebas de Vitest
      run: |
        cd frontend
        # Ejecutamos las pruebas una sola vez (modo run)
        npx vitest run

    - name: Verificar el Build de Producción
      env:
        VITE_API_URL: http://localhost:8000
      run: |
        cd frontend
        npm run build

  # 3. DESPLIEGUE EN EC2
  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Conectar por SSH y desplegar con Docker Compose
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          cd /home/ec2-user/app
          git pull origin main
          docker compose up -d --build
          docker image prune -f