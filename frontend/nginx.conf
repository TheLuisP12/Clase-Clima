server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API al servicio "backend" de docker-compose (red interna).
    # Se mantiene el prefijo /api/... tal cual porque proxy_pass no incluye
    # una ruta propia (nginx reenvía la URI original completa).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta no encontrada como archivo cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
